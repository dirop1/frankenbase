[program:frankenphp-watchdog]
process_name=%(program_name)s
command=/usr/local/bin/frankenphp-watchdog
directory=/app
# Requires access to Supervisor's root-owned control socket.
user=root
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=10
# Priority 20 — starts after FrankenPHP.
priority=20
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
