[program:scheduler]
process_name=%(program_name)s
command=php artisan schedule:work
directory=/app
autostart=true
autorestart=true
user=application
startretries=3
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopsignal=QUIT            ; Just a placeholder, the actual stop command will be used
stopasgroup=true           ; Send the stop signal to the whole process group
stopwaitsecs=80            ; Time to wait for the process to stop gracefully
stop=php artisan schedule:interrupt  ; Custom stop command