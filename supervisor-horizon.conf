[program:horizon]
process_name=%(program_name)s
command=php artisan horizon
directory=/app
user=application
autostart=true
autorestart=true
startretries=3          ; Number of attempts to restart the program
startsecs=10            ; Time to wait before considering the start successful
exitcodes=0,2           ; Expected exit codes to be considered a successful run
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT            ; Just a placeholder, the actual stop command will be used
stopasgroup=true           ; Send the stop signal to the whole process group
stopwaitsecs=120            ; Time to wait for the process to stop gracefully
stop=php artisan horizon:terminate  ; Custom stop command