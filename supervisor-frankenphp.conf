[program:frankenphp]
process_name=%(program_name)s
command=/usr/local/bin/frankenphp-init
directory=/app
user=application
autostart=true
autorestart=true
startretries=3
startsecs=10
stopwaitsecs=30
# Priority 10 — starts before Horizon and Scheduler
priority=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
