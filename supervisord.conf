; Enable RPC interface for supervisorctl
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
[supervisord]
nodaemon=true
# Supervisor stays as PID 1; application programs explicitly drop privileges.
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/frankenbase/supervisord.pid
childlogdir=/tmp

[include]
files = /etc/supervisor.d/*.conf

[unix_http_server]
file=/run/frankenbase/supervisor.sock
chmod=0700                  ; permissões

[supervisorctl]
serverurl=unix:///run/frankenbase/supervisor.sock

